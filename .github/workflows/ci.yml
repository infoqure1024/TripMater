# CI: 品質ゲート（全 PR・プッシュ）
# lint / typecheck / test を独立ジョブで並列実行し、すべて green になったら
# android-build（assembleDebug）でビルド検証する（fail-fast）。
# Issue #61。CLAUDE.md「CI/CD」章の仕様に対応。
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

# 同一 ref（同じ PR / ブランチ）の古い実行はキャンセルしてランナーを節約する。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ワークフローに書き込み権限は不要（read-only でビルド・テストするだけ）。
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # package.json engines.node は >=20
          cache: npm # ~/.npm を自動キャッシュ（lockfile ハッシュをキー）

      - name: Install dependencies (npm ci)
        run: npm ci # lockfile 厳守で再現性を担保

      - name: Run ESLint
        run: npm run lint # eslint .（@react-native 設定 + Prettier）

  typecheck:
    name: Type check (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck # tsc --noEmit

  test:
    name: Unit / Integration tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # react-native-background-actions のネイティブ依存は __mocks__/ の手動モックで
      # 解決済みのため、追加のネイティブセットアップなしでランナー上で完結する。
      - name: Run Jest
        run: npm test -- --ci --coverage

      - name: Upload coverage report
        if: always() # テスト失敗時もカバレッジが出ていれば残す
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  android-build:
    name: Android debug build (assembleDebug)
    runs-on: ubuntu-latest
    # lint / typecheck / test がすべて通ってから走らせる（ムダな重いビルドを避ける）。
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci # RN の autolink / JS バンドルに必要

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin # Eclipse Temurin（RN 0.81 は JDK 17 想定）
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Gradle のダウンロード済み依存とラッパーをキャッシュしてビルド時間を短縮する。
      # setup-java の Gradle キャッシュは使わず、明示的にキーを管理する。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon # CI では daemon 不要

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
