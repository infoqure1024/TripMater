# CD: リリース配布（v* タグ起動）
# v* タグ push で起動し、Android のリリース成果物（APK / AAB / mapping）をビルドして
# GitHub Release に添付する。Issue #61。
#
# 秘密情報（署名鍵・Play 資格情報）はリポジトリに置かず、すべて GitHub Secrets から注入する。
name: Release (CD)

on:
  # 起動は v* タグ push に一本化する（release: published と併用すると、同一リリースで
  # ビルドが二重に走るため）。GitHub Release を作成すると対応する v* タグの push で
  # これが起動し、下記 action-gh-release が（未作成なら）Release を作成して添付する。
  push:
    tags:
      - 'v*'

# Release Assets へ添付するため contents: write が必要。
permissions:
  contents: write

jobs:
  android-release:
    name: Android release build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # GitHub Environments の "production" を指定。
    # Settings → Environments → production に Required reviewers（手動承認）を設定すると、
    # このジョブは承認されるまで待機する。これが Play 提出前の人手ゲートになる。
    # （CLAUDE.md「CD の Play アップロードは手動承認（environment protection）を挟む」）
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # リリース署名鍵を GitHub Secrets から復元する。
      # ANDROID_KEYSTORE_BASE64 は keystore(.jks) を base64 エンコードした文字列。
      #
      # ⚠️ 重要: 現状 android/app/build.gradle の release ビルドは
      #   signingConfig signingConfigs.debug（デバッグ署名）のままなので、
      #   ここで復元・受け渡す鍵は **まだ実際の署名には使われない**。
      #   本番署名を有効にするには別途 build.gradle の signingConfigs に release を追加し、
      #   buildTypes.release.signingConfig を signingConfigs.release に切り替える必要がある
      #   （下記 -P プロパティ MYAPP_UPLOAD_* を参照する想定。Issue 別タスク）。
      #   それまでは下記ステップは「鍵注入の配線のみ」を用意した状態。
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Release build will fall back to debug signing (see build.gradle)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Gradle へ -P プロパティとして署名情報を渡す。build.gradle 側で
      # project.hasProperty('MYAPP_UPLOAD_STORE_FILE') 等を参照する signingConfig を
      # 追加すれば、ここで渡した値で本番署名できる（現状は未配線のため no-op）。
      - name: Build release APK + AAB
        working-directory: android
        env:
          # 環境変数経由で Gradle に渡す（ログに値が出ないよう -P 直書きは避ける）。
          MYAPP_UPLOAD_STORE_FILE: ${{ env.RELEASE_KEYSTORE_PATH }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PMYAPP_UPLOAD_STORE_FILE="${MYAPP_UPLOAD_STORE_FILE:-}" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="${MYAPP_UPLOAD_STORE_PASSWORD:-}" \
            -PMYAPP_UPLOAD_KEY_ALIAS="${MYAPP_UPLOAD_KEY_ALIAS:-}" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="${MYAPP_UPLOAD_KEY_PASSWORD:-}"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      # ProGuard/R8 の mapping ファイル（クラッシュの難読化解除に必要）。
      # minify 無効時は生成されないため warn 扱い。
      - name: Upload mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      # v* タグ起動なので常に成立。Release が無ければ action-gh-release が作成し、
      # 成果物を Release Assets として添付する（既存なら更新）。
      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false

      # --- Play Console 内部テストトラックへの自動アップロード（既定で無効） ---
      # ⚠️ デフォルト無効。FGS(location) / ACCESS_BACKGROUND_LOCATION の Play 宣言
      #    （CLAUDE.md「Google Play Console 申告チェックリスト」）が未完だと審査に通らないため、
      #    宣言完了 + リリース署名（build.gradle 切替）完了まで有効化しない。
      #
      # 有効化するには:
      #   1) build.gradle の release を本番署名に切り替える（上記参照）。
      #   2) Play Console のサービスアカウント JSON を Secrets PLAY_SERVICE_ACCOUNT_JSON に登録。
      #   3) 下記 if の 'false' を外す（例: startsWith(github.ref, 'refs/tags/v')）。
      - name: Upload to Google Play (internal track) [DISABLED]
        if: ${{ false }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.odometer # アプリの applicationId に合わせる
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal # まずは内部テストトラックへ
          status: completed
