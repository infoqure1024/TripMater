# Server CI: quality gate for the location ingest server (server/)
# Runs on PRs and pushes to main when server/** or the OpenAPI spec changes.
# Jobs: lint, typecheck, migrate (reversibility), test, contract (optional), docker-build.
# Issue #62.
name: Server CI

on:
  pull_request:
    paths:
      - 'server/**'
      - 'docs/server/openapi.yaml'
      - '.github/workflows/server-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'docs/server/openapi.yaml'
      - '.github/workflows/server-ci.yml'

# Cancel stale runs on the same ref to avoid wasting runner minutes.
concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All run steps default to the server/ directory.
defaults:
  run:
    working-directory: server

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  server-lint:
    name: Server lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  # ── Type check ──────────────────────────────────────────────────────────
  server-typecheck:
    name: Server typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  # ── Migrate (reversibility check) ───────────────────────────────────────
  server-migrate:
    name: Server migrate (up → down → up)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripmater
          POSTGRES_PASSWORD: tripmater
          POSTGRES_DB: tripmater_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://tripmater:tripmater@localhost:5432/tripmater_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migrate up
        run: npm run migrate:up

      - name: Migrate down (reversibility check)
        run: npm run migrate:down

      - name: Migrate up again (confirm clean state)
        run: npm run migrate:up

  # ── Test ────────────────────────────────────────────────────────────────
  server-test:
    name: Server tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: server-migrate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripmater
          POSTGRES_PASSWORD: tripmater
          POSTGRES_DB: tripmater_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://tripmater:tripmater@localhost:5432/tripmater_test
      ADMIN_API_KEY: ci-test-admin-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate:up

      - name: Run Jest
        run: npm test -- --ci --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ── Contract tests (optional) ────────────────────────────────────────────
  server-contract:
    name: Server contract tests (OpenAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Contract tests are informational until Issue #59 lands — don't block merge.
    continue-on-error: true
    needs: server-migrate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripmater
          POSTGRES_PASSWORD: tripmater
          POSTGRES_DB: tripmater_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://tripmater:tripmater@localhost:5432/tripmater_test
      ADMIN_API_KEY: ci-test-admin-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate:up

      - name: Run contract tests
        run: npm run test:contract

  # ── Docker build ─────────────────────────────────────────────────────────
  server-docker-build:
    name: Server Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run after all quality gates pass.
    needs: [server-lint, server-typecheck, server-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: dockerfile-check
        # working-directory default is server/ but this is a shell check for a path
        run: |
          if [ -f server/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ github.workspace }}

      - name: Notice — Dockerfile not yet present (Issue #58)
        if: steps.dockerfile-check.outputs.exists == 'false'
        run: |
          echo "::notice file=server/Dockerfile::Dockerfile not found — skipping Docker build (see Issue #58). Add server/Dockerfile to enable this step."

      - name: Set up Docker Buildx
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: false
          tags: tripmater-server:ci-${{ github.sha }}
